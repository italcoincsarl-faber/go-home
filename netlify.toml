[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Redirection pour la recherche web (vers web-search.ts)
[[redirects]]
  from = "/api/web-search"
  to = "/.netlify/functions/web-search"
  status = 200

# Redirection pour le générateur de leads (vers gemini.ts)
[[redirects]]
  from = "/api/leads/generate"
  to = "/.netlify/functions/gemini"
  status = 200

# Redirection pour les propriétés (vers gemini pour l'instant)
[[redirects]]
  from = "/api/properties"
  to = "/.netlify/functions/gemini"
  status = 200

# Redirection pour le contact (vers gemini pour l'instant)
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/gemini"
  status = 200

# ATTENTION : La règle "/api/*" a été SUPPRIMÉE pour que web-search soit accessible !
